<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Budget</title>
<style>
:root{
  color-scheme:dark;
  --bg:#121211;--panel:#1a1a19;--panel2:#222221;--line:#2e2e2c;
  --txt:#f0efec;--mute:#c3c2b7;--dim:#8d8c84;
  --c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#0ca30c;--c6:#9085e9;--c7:#e66767;--c8:#8d8c84;
  --good:#0ca30c;--warn:#fab219;--bad:#ec835a;--crit:#d03b3b;
  --btn:#f0efec;--btn-txt:#121211;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f0ed;--panel:#fcfcfb;--panel2:#f4f3f0;--line:#e3e2dd;
  --txt:#0b0b0b;--mute:#52514e;--dim:#7b7a74;
  --c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#eda100;--c4:#e87ba4;--c5:#008300;--c6:#6250d6;--c7:#e34948;--c8:#8d8c84;
  --btn:#0b0b0b;--btn-txt:#fcfcfb;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(20,20,10,.06);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f1f0ed;--panel:#fcfcfb;--panel2:#f4f3f0;--line:#e3e2dd;
    --txt:#0b0b0b;--mute:#52514e;--dim:#7b7a74;
    --c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#eda100;--c4:#e87ba4;--c5:#008300;--c6:#6250d6;--c7:#e34948;
    --btn:#0b0b0b;--btn-txt:#fcfcfb;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(20,20,10,.06);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 "SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.brand{font-weight:650;letter-spacing:-.01em;font-size:1.05rem;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(var(--c0) 0 38%,var(--c1) 0 62%,var(--c2) 0 82%,var(--c3) 0);display:block}
.mnav{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.mnav button{width:34px;height:34px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:var(--mute);font-size:1.1rem}
.mnav button:hover{background:var(--panel2);color:var(--txt)}
.mnav .lbl{min-width:132px;text-align:center;font-weight:600;cursor:pointer;border-radius:9px;padding:6px 8px}
.mnav .lbl:hover{background:var(--panel2)}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--mute)}
.ibtn:hover{color:var(--txt);border-color:var(--dim)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;color:var(--dim);padding:10px 14px;cursor:pointer;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button[aria-selected=true]{color:var(--txt);border-bottom-color:var(--txt)}

/* layout */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}
@media(max-width:860px){.s7,.s6,.s5{grid-column:span 12}.mnav .lbl{min-width:112px}.brand span{display:none}}
.card h2{margin:0 0 14px;font-size:.95rem;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2 small{font-weight:500;color:var(--dim);font-size:.82rem}
.sub{color:var(--dim);font-size:.85rem}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media(max-width:620px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:2.5rem;font-weight:650;letter-spacing:-.03em;line-height:1.05}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.85rem;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.status b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#121211;font-size:.72rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;width:100%}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;text-align:left}
.kpi small{display:block;color:var(--dim);font-size:.78rem}
.kpi b{font-size:1.2rem;letter-spacing:-.01em}
.hero-r{width:100%}
.hero-r .big{margin:10px 0 2px}

/* insights */
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins div{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.ins small{display:block;color:var(--dim);font-size:.78rem;margin-bottom:3px}
.ins b{font-size:1.15rem;letter-spacing:-.01em}
.ins span{display:block;color:var(--dim);font-size:.78rem;margin-top:2px}

/* donut */
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
@media(max-width:520px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{position:relative;width:200px;height:200px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .seg{fill:none;stroke-width:22;cursor:pointer;transition:stroke-width .15s,opacity .2s}
.donut .seg:hover{stroke-width:27}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.legend{display:flex;flex-direction:column;gap:2px;width:100%}
.lg{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.lg:hover,.lg.on{background:var(--panel2)}
.lg i{width:11px;height:11px;border-radius:4px;flex:none}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg em{font-style:normal;color:var(--dim);font-size:.82rem}
.lg.dim{opacity:.45}

/* charts */
.seg-ctl{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg-ctl button{border:0;background:transparent;color:var(--dim);padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem}
.seg-ctl button[aria-pressed=true]{background:var(--panel);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.25)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--dim);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.col .b{opacity:.88;transition:opacity .12s}
.col:hover .b{opacity:1}
.col .xh{opacity:0}.col:hover .xh{opacity:1}
.col{cursor:pointer}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);margin-bottom:8px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:.85rem;font-weight:600}
.chip button{border:0;background:var(--line);color:var(--txt);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* progress rows */
.prow{padding:9px 8px;border-radius:12px;cursor:pointer}
.prow:hover,.prow.on{background:var(--panel2)}
.prow .t{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.prow .t i{width:10px;height:10px;border-radius:3px}
.prow .t span{flex:1}
.prow .t em{font-style:normal;color:var(--dim);font-size:.85rem}
.pb{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.pb u{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.note{font-size:.78rem;margin-top:5px;display:flex;gap:6px;align-items:center}

/* lists */
.tx{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;cursor:pointer}
.tx:hover{background:var(--panel2)}
.tx i{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:#121211;font-weight:700;font-size:.85rem}
.tx .d{flex:1;min-width:0}
.tx .d b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .d small{color:var(--dim)}
.tx .a{font-weight:600}
.dayh{display:flex;justify-content:space-between;color:var(--dim);font-size:.8rem;font-weight:600;padding:14px 8px 4px}
.empty{padding:34px 10px;text-align:center;color:var(--dim)}

/* forms */
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--c0);outline-offset:1px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--txt);height:22px}
.btn{background:var(--btn);color:var(--btn-txt);border:0;border-radius:11px;padding:10px 16px;font-weight:650;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--dim)}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--line)}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow>*{flex:1 1 120px}
.lbl2{font-size:.78rem;color:var(--dim);margin:12px 0 5px;display:block}
.brow{display:grid;grid-template-columns:12px 1fr 96px 34px;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .sl{grid-column:2/4}
.brow .nm{background:transparent;border-color:transparent;padding:6px 8px;font-weight:600}
.brow .nm:hover,.brow .nm:focus{background:var(--panel2);border-color:var(--line)}
.brow i{width:11px;height:11px;border-radius:4px}
.x{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--dim);cursor:pointer}
.x:hover{background:var(--panel2);color:var(--crit)}
.alloc{display:flex;gap:2px;height:14px;margin:6px 0 10px}
.alloc u{display:block;height:100%;border-radius:4px;min-width:2px}

/* fab + modal + toast + tooltip */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--btn);color:var(--btn-txt);font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;font-size:1rem}
.fab:hover{transform:translateY(-1px)}
.fab span{font-size:1.4rem;line-height:1;margin-top:-2px}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:20px;padding:22px;width:min(440px,calc(100vw - 28px));box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:1.1rem}
.kind{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0 4px}
.kind button{flex:1;border:0;background:transparent;color:var(--dim);padding:9px;border-radius:9px;cursor:pointer;font-weight:650}
.kind button[aria-pressed=true]{background:var(--panel);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.amt{font-size:1.9rem;font-weight:650;letter-spacing:-.02em;padding:12px 14px}
.catpick{display:flex;gap:7px;flex-wrap:wrap}
.catpick button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:.88rem}
.catpick button i{width:9px;height:9px;border-radius:3px}
.catpick button[aria-pressed=true]{border-color:var(--txt);background:var(--panel)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--dim);border-radius:11px;padding:8px 11px;font-size:.82rem;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .08s;max-width:240px}
#tip b{display:block;margin-bottom:2px}
#tip i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--btn);color:var(--btn-txt);padding:11px 14px 11px 18px;border-radius:14px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:70}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i><span>Budget</span></div>
      <div class="mnav">
        <button id="prev" aria-label="Previous month">‹</button>
        <div class="lbl" id="monthLabel" title="Jump to this month"></div>
        <button id="next" aria-label="Next month">›</button>
      </div>
      <button class="ibtn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg></button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab"><span>+</span> Add</button>

<dialog id="dlg"></dialog>
<div id="tip"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
'use strict';
/* ---------- state & storage ---------- */
const KEY = 'budget-v1';
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { db = {}; }
db.months = db.months || {};
db.recurring = db.recurring || [];
db.colors = db.colors || {};
db.cur = db.cur || '€';
db.theme = db.theme || 'auto';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const realYM = () => todayStr().slice(0, 7);
let cur = realYM();
const S = {tab: 'overview', cat: null, day: null, mode: 'daily', q: ''};

const shift = (ym, d) => { const [y, m] = ym.split('-').map(Number); const dt = new Date(y, m - 1 + d, 1); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = (ym, long = true) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, long ? {month: 'long', year: 'numeric'} : {month: 'short'}); };
const fmt = (n, dec = 2) => db.cur + Number(Math.round(n * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: dec, maximumFractionDigits: dec});
const fmt0 = n => db.cur + Math.round(n).toLocaleString();

/* colour slots follow the category name, never its rank */
function slotFor(name) {
  const k = name.trim().toLowerCase();
  if (db.colors[k] !== undefined) return db.colors[k];
  const used = new Set(Object.values(db.colors));
  let s = 0; while (used.has(s) && s < 8) s++;
  return (db.colors[k] = s > 7 ? 8 : s);
}
const colorOf = c => `var(--c${slotFor(c.name)})`;

const DEFAULT_CATS = [['Rent', 0], ['Food', 0], ['Transport', 0], ['Fun', 0], ['Savings', 0]];
const M = ym => {
  ym = ym || cur;
  if (!db.months[ym]) {
    const prev = db.months[shift(ym, -1)];
    const src = prev ? prev.cats.map(c => [c.name, c.budget]) : DEFAULT_CATS;
    db.months[ym] = {income: [], cats: src.map(([name, budget]) => ({id: uid(), name, budget})), tx: [], skip: []};
  }
  const m = db.months[ym];
  m.skip = m.skip || [];
  m.cats.forEach(c => slotFor(c.name));
  return m;
};

function ensureCat(m, name) {
  let c = m.cats.find(c => c.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = {id: uid(), name, budget: 0}; m.cats.push(c); }
  return c;
}

function applyRecurring() {
  if (cur > realYM()) return;
  const m = M();
  let changed = false;
  db.recurring.forEach(r => {
    if (cur < r.from) return;
    if (m.skip.includes(r.id)) return;
    const day = Math.min(r.day, daysIn(cur));
    const date = cur + '-' + String(day).padStart(2, '0');
    if (r.kind === 'income') {
      if (!m.income.some(i => i.rec === r.id)) { m.income.push({id: uid(), name: r.name, amount: r.amount, rec: r.id}); changed = true; }
    } else if (!m.tx.some(t => t.rec === r.id)) {
      const c = ensureCat(m, r.cat);
      m.tx.push({id: uid(), cat: c.id, amount: r.amount, note: r.name, date, rec: r.id}); changed = true;
    }
  });
  if (changed) save();
}

/* ---------- derived numbers ---------- */
function calc() {
  const m = M(), days = daysIn(cur), real = realYM();
  const inc = m.income.reduce((s, i) => s + i.amount, 0);
  const spent = m.tx.reduce((s, t) => s + t.amount, 0);
  const planned = m.cats.reduce((s, c) => s + c.budget, 0);
  const byCat = m.cats.map(c => ({c, spent: m.tx.filter(t => t.cat === c.id).reduce((a, t) => a + t.amount, 0)}));
  const elapsed = cur === real ? Number(todayStr().slice(8)) : cur < real ? days : 0;
  const remainingDays = cur === real ? days - elapsed + 1 : cur > real ? days : 0;
  const left = inc - spent;
  const avg = elapsed ? spent / elapsed : 0;
  const projected = cur === real && elapsed ? avg * days : spent;
  const safe = remainingDays > 0 ? Math.max(0, left) / remainingDays : 0;
  const rate = inc > 0 ? left / inc : 0;
  const biggest = m.tx.length ? m.tx.reduce((a, b) => b.amount > a.amount ? b : a) : null;
  const top = byCat.length ? byCat.reduce((a, b) => b.spent > a.spent ? b : a) : null;
  return {m, days, inc, spent, planned, byCat, elapsed, remainingDays, left, avg, projected, safe, rate, biggest, top};
}

/* ---------- chart helpers ---------- */
const chartW = max => Math.max(300, Math.min(max, ($('view').clientWidth || max) - 44));
const nice = max => { if (max <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(max))), f = max / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
const barPath = (x, y, w, h, r) => { if (h <= 0) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const tip = (title, rows) => esc(`<b>${title}</b>` + rows.map(r => `<div>${r}</div>`).join(''));
const sw = col => `<i style="background:${col}"></i>`;

function ringSVG(pct, color) {
  const r = 86, C = 2 * Math.PI * r, p = clamp(pct, 0, 1);
  return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="16"/>
  <circle id="ringArc" cx="100" cy="100" r="${r}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - p)}" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}

function donutHTML(k) {
  const items = k.byCat.filter(x => x.spent > 0).sort((a, b) => b.spent - a.spent);
  const total = items.reduce((s, x) => s + x.spent, 0);
  const r = 78, C = 2 * Math.PI * r;
  let off = 0, segs = '';
  items.forEach(x => {
    const len = x.spent / total * C, gap = items.length > 1 ? 2.5 : 0;
    const dim = S.cat && S.cat !== x.c.id;
    segs += `<circle class="seg" cx="100" cy="100" r="${r}" stroke="${colorOf(x.c)}" stroke-dasharray="${Math.max(0.5, len - gap)} ${C}" stroke-dashoffset="${-off}" opacity="${dim ? .3 : 1}"
      data-act="cat" data-id="${x.c.id}" data-tip="${tip(esc(x.c.name), [sw(colorOf(x.c)) + fmt(x.spent), Math.round(x.spent / total * 100) + '% of spending'])}"/>`;
    off += len;
  });
  const sel = S.cat && items.find(x => x.c.id === S.cat);
  const center = !items.length ? `<span class="sub">No spending</span>`
    : sel ? `<span class="sub">${esc(sel.c.name)}</span><b style="font-size:1.4rem">${fmt0(sel.spent)}</b><span class="sub">${Math.round(sel.spent / total * 100)}%</span>`
    : `<span class="sub">Spent</span><b style="font-size:1.5rem">${fmt0(total)}</b><span class="sub">${items.length} categor${items.length === 1 ? 'y' : 'ies'}</span>`;
  const legend = items.map(x => `<button class="lg ${S.cat === x.c.id ? 'on' : ''} ${S.cat && S.cat !== x.c.id ? 'dim' : ''}" data-act="cat" data-id="${x.c.id}"><i style="background:${colorOf(x.c)}"></i><span>${esc(x.c.name)}</span><em>${Math.round(x.spent / total * 100)}%</em><b>${fmt0(x.spent)}</b></button>`).join('');
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="22"/>${segs}</svg><div class="c">${center}</div></div>
  <div class="legend">${legend || '<div class="empty">Add an expense to see where your money goes.</div>'}</div></div>`;
}

function dailyHTML(k) {
  const {m, days} = k;
  const per = Array(days + 1).fill(0);
  m.tx.filter(t => !S.cat || t.cat === S.cat).forEach(t => per[Math.min(days, Math.max(1, Number(t.date.slice(8))))] += t.amount);
  const cum = []; per.reduce((a, v, i) => (cum[i] = a + (i ? v : 0), a + (i ? v : 0)), 0);
  const cumulative = S.mode === 'cum';
  const target = S.cat ? (m.cats.find(c => c.id === S.cat) || {budget: 0}).budget : (k.planned || k.inc);
  const maxV = cumulative ? Math.max(cum[days], target) : Math.max(...per);
  const top = nice(maxV * 1.05);
  const W = chartW(640), H = 230, L = 44, R = 8, T = 10, B = 26, iw = W - L - R, ih = H - T - B, cw = iw / days;
  const y = v => T + ih - v / top * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending">`;
  [0, .5, 1].forEach(f => { const v = top * f; s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt0(v)}</text>`; });
  for (let d = 1; d <= days; d++) if (d === 1 || d % 5 === 0) s += `<text x="${L + (d - .5) * cw}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  const col = S.cat ? colorOf(m.cats.find(c => c.id === S.cat) || {name: ''}) : 'var(--c0)';
  const real = realYM(), tdy = Number(todayStr().slice(8));
  if (cur === real) s += `<line x1="${L + (tdy - .5) * cw}" x2="${L + (tdy - .5) * cw}" y1="${T}" y2="${T + ih}" stroke="var(--dim)" stroke-dasharray="3 4"/>`;
  if (cumulative) {
    if (target > 0) s += `<line x1="${L}" y1="${y(0)}" x2="${L + iw}" y2="${y(target)}" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W - R}" y="${y(target) - 6}" text-anchor="end">Pace to ${fmt0(target)}</text>`;
    const last = cur === real ? tdy : cur < real ? days : 0;
    let pts = []; for (let d = 1; d <= Math.max(1, last); d++) pts.push([L + (d - .5) * cw, y(cum[d])]);
    s += `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  for (let d = 1; d <= days; d++) {
    const x = L + (d - 1) * cw, v = cumulative ? cum[d] : per[d];
    const tp = tip(new Date(cur + '-' + String(d).padStart(2, '0') + 'T12:00').toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'}),
      [sw(col) + 'Spent ' + fmt(per[d]), cumulative || true ? 'Total so far ' + fmt(cum[d]) : '', 'Click to see transactions']);
    s += `<g class="col" data-act="day" data-day="${d}" data-tip="${tp}"><rect x="${x}" y="${T}" width="${cw}" height="${ih + 4}" fill="transparent"/>`;
    if (!cumulative) s += `<path class="b" d="${barPath(x + cw * .18, y(per[d]), cw * .64, T + ih - y(per[d]), 4)}" fill="${col}" ${S.day && Number(S.day) !== d ? 'opacity=".35"' : ''}/>`;
    else s += `<g class="xh"><line x1="${x + cw / 2}" x2="${x + cw / 2}" y1="${T}" y2="${T + ih}" stroke="var(--dim)"/><circle cx="${x + cw / 2}" cy="${y(v)}" r="5" fill="${col}" stroke="var(--panel)" stroke-width="2"/></g>`;
    s += `</g>`;
  }
  return s + '</svg>';
}

function trendHTML() {
  const months = []; for (let i = 5; i >= 0; i--) months.push(shift(cur, -i));
  const data = months.map(ym => { const m = db.months[ym]; return {ym, inc: m ? m.income.reduce((s, i) => s + i.amount, 0) : 0, sp: m ? m.tx.reduce((s, t) => s + t.amount, 0) : 0}; });
  const top = nice(Math.max(1, ...data.flatMap(d => [d.inc, d.sp])) * 1.05);
  const W = chartW(520), H = 220, L = 44, R = 6, T = 10, B = 26, iw = W - L - R, ih = H - T - B, cw = iw / 6;
  const y = v => T + ih - v / top * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending, last six months">`;
  [0, .5, 1].forEach(f => { const v = top * f; s += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt0(v)}</text>`; });
  data.forEach((d, i) => {
    const x = L + i * cw, bw = cw * .3, on = d.ym === cur;
    const tp = tip(monthName(d.ym), [sw('var(--c0)') + 'Income ' + fmt(d.inc), sw('var(--c1)') + 'Spent ' + fmt(d.sp), 'Saved ' + fmt(d.inc - d.sp), 'Click to open']);
    s += `<g class="col" data-act="month" data-ym="${d.ym}" data-tip="${tp}"><rect x="${x}" y="${T}" width="${cw}" height="${ih + B}" fill="${on ? 'var(--panel2)' : 'transparent'}" rx="8"/>
      <path class="b" d="${barPath(x + cw * .17, y(d.inc), bw, T + ih - y(d.inc), 4)}" fill="var(--c0)"/>
      <path class="b" d="${barPath(x + cw * .17 + bw + 3, y(d.sp), bw, T + ih - y(d.sp), 4)}" fill="var(--c1)"/>
      <text x="${x + cw / 2}" y="${H - 6}" text-anchor="middle" ${on ? 'style="fill:var(--txt);font-weight:700"' : ''}>${monthName(d.ym, false)}</text></g>`;
  });
  return s + '</svg>';
}

function catBarsHTML(k) {
  const rows = k.byCat.map(({c, spent}) => {
    const p = c.budget > 0 ? spent / c.budget : (spent > 0 ? 1.01 : 0);
    const st = p > 1 ? ['var(--crit)', '✕', `Over by ${fmt(spent - c.budget)}`] : p > .85 ? ['var(--warn)', '!', `${fmt(c.budget - spent)} left`] : ['var(--good)', '✓', c.budget > 0 ? `${fmt(c.budget - spent)} left` : ''];
    return `<div class="prow ${S.cat === c.id ? 'on' : ''}" data-act="cat" data-id="${c.id}"><div class="t"><i style="background:${colorOf(c)}"></i><span>${esc(c.name)}</span><em>${fmt0(spent)} / ${c.budget ? fmt0(c.budget) : 'no limit'}</em></div>
      <div class="pb"><u style="width:${clamp(p, 0, 1) * 100}%;background:${st[0]}"></u></div>${st[2] ? `<div class="note" style="color:var(--mute)"><b style="color:${st[0]}">${st[1]}</b>${st[2]}</div>` : ''}</div>`;
  }).join('');
  return rows || '<div class="empty">No categories yet. Add some in the Budget tab.</div>';
}

/* ---------- views ---------- */
const TABS = [['overview', 'Overview'], ['tx', 'Transactions'], ['budget', 'Budget'], ['recurring', 'Recurring']];

function viewOverview() {
  const k = calc();
  const pct = k.inc > 0 ? k.spent / k.inc : (k.spent > 0 ? 1 : 0);
  const projPct = k.inc > 0 ? k.projected / k.inc : 0;
  const st = k.inc === 0 && k.spent === 0 ? ['var(--dim)', '–', 'Add income to get started']
    : k.left < 0 ? ['var(--crit)', '✕', 'Over budget']
    : projPct > 1 ? ['var(--bad)', '!', 'On pace to overspend']
    : projPct > .85 ? ['var(--warn)', '!', 'Watch your pace'] : ['var(--good)', '✓', 'On track'];
  const ringCol = pct > 1 ? 'var(--crit)' : pct > .85 ? 'var(--warn)' : 'var(--c0)';
  const filterChip = (S.cat || S.day) ? `<div class="chips">${S.cat ? `<span class="chip">${esc((k.m.cats.find(c => c.id === S.cat) || {name: '?'}).name)}<button data-act="clearcat" aria-label="Clear category">✕</button></span>` : ''}</div>` : '';
  return `<div class="grid">
  <section class="card s12"><div class="hero">
    <div class="ring" data-tip="${tip('Spent so far', [fmt(k.spent) + ' of ' + fmt(k.inc) + ' income', Math.round(pct * 100) + '% used'])}">${ringSVG(pct, ringCol)}<div class="c"><span class="sub">Left this month</span><span class="big" id="heroLeft" data-v="${k.left}">${fmt0(k.left)}</span></div></div>
    <div class="hero-r"><span class="status"><b style="background:${st[0]}">${st[1]}</b>${st[2]}</span>
      <div class="big" style="font-size:1.7rem;margin-top:12px">${k.remainingDays > 0 && k.left > 0 ? `${fmt0(k.safe)} <span class="sub" style="font-size:.95rem;font-weight:500">safe to spend per day · ${k.remainingDays} days left</span>` : `<span style="font-size:1.1rem;font-weight:550;color:var(--mute)">${k.elapsed >= k.days ? 'Month complete' : k.left <= 0 && k.inc ? 'No budget left this month' : monthName(cur)}</span>`}</div>
      <div class="kpis"><div class="kpi"><small>Income</small><b>${fmt0(k.inc)}</b></div><div class="kpi"><small>Spent</small><b>${fmt0(k.spent)}</b></div><div class="kpi"><small>Planned</small><b>${fmt0(k.planned)}</b></div></div></div>
  </div></section>

  <section class="card s6"><h2>Where it went <small>Tap a slice to filter</small></h2>${donutHTML(k)}</section>

  <section class="card s6"><h2>Insights</h2><div class="ins">
    <div><small>Saved</small><b class="${k.left < 0 ? '' : ''}" style="color:${k.left < 0 ? 'var(--crit)' : 'var(--txt)'}">${fmt0(k.left)}</b><span>${k.inc ? Math.round(k.rate * 100) + '% of income' : 'No income yet'}</span></div>
    <div><small>Daily average</small><b>${fmt0(k.avg)}</b><span>${k.elapsed} day${k.elapsed === 1 ? '' : 's'} counted</span></div>
    <div><small>Projected month-end</small><b>${fmt0(k.projected)}</b><span>${k.inc ? (k.projected > k.inc ? 'Above income by ' + fmt0(k.projected - k.inc) : fmt0(k.inc - k.projected) + ' under income') : 'Needs income'}</span></div>
    <div><small>Biggest expense</small><b>${k.biggest ? fmt0(k.biggest.amount) : '–'}</b><span>${k.biggest ? esc(k.biggest.note || (k.m.cats.find(c => c.id === k.biggest.cat) || {name: ''}).name) : 'Nothing logged'}</span></div>
  </div></section>

  <section class="card s12"><h2><span>Daily spending</span><span class="seg-ctl"><button data-act="mode" data-m="daily" aria-pressed="${S.mode === 'daily'}">Per day</button><button data-act="mode" data-m="cum" aria-pressed="${S.mode === 'cum'}">Running total</button></span></h2>
    ${filterChip}${dailyHTML(k)}</section>

  <section class="card s7"><h2>Last 6 months <small>Tap a month to open it</small></h2><div class="key"><span><i style="background:var(--c0)"></i>Income</span><span><i style="background:var(--c1)"></i>Spent</span></div>${trendHTML()}</section>

  <section class="card s5"><h2>Budget by category</h2>${catBarsHTML(k)}</section>
  </div>`;
}

function viewTx() {
  const k = calc(), m = k.m;
  let list = m.tx.slice();
  if (S.cat) list = list.filter(t => t.cat === S.cat);
  if (S.day) list = list.filter(t => Number(t.date.slice(8)) === Number(S.day));
  const q = S.q.trim().toLowerCase();
  const nameOf = id => (m.cats.find(c => c.id === id) || {name: 'Uncategorised'}).name;
  if (q) list = list.filter(t => (t.note + ' ' + nameOf(t.cat) + ' ' + t.amount).toLowerCase().includes(q));
  list.sort((a, b) => b.date.localeCompare(a.date) || b.amount - a.amount);
  const groups = {}; list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const total = list.reduce((s, t) => s + t.amount, 0);
  const chips = `<div class="chips"><button class="chip" style="cursor:pointer;padding:6px 12px;${!S.cat ? 'border-color:var(--txt)' : ''}" data-act="clearcat">All</button>` +
    m.cats.map(c => `<button class="chip" style="cursor:pointer;padding:6px 12px;${S.cat === c.id ? 'border-color:var(--txt)' : ''}" data-act="cat" data-id="${c.id}"><span style="width:9px;height:9px;border-radius:3px;display:inline-block;background:${colorOf(c)}"></span>${esc(c.name)}</button>`).join('') +
    (S.day ? `<span class="chip">Day ${Number(S.day)}<button data-act="clearday" aria-label="Clear day">✕</button></span>` : '') + `</div>`;
  const rows = Object.keys(groups).map(d => {
    const dt = new Date(d + 'T12:00').toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long'});
    const sum = groups[d].reduce((s, t) => s + t.amount, 0);
    return `<div class="dayh"><span>${dt}</span><span>${fmt(sum)}</span></div>` + groups[d].map(t => {
      const c = m.cats.find(c => c.id === t.cat) || {name: '?'};
      return `<div class="tx" data-act="edit" data-id="${t.id}"><i style="background:${colorOf(c)}">${esc(c.name.slice(0, 1).toUpperCase())}</i><div class="d"><b>${esc(t.note || c.name)}</b><small>${esc(c.name)}${t.rec ? ' · recurring' : ''}</small></div><div class="a">−${fmt(t.amount)}</div></div>`;
    }).join('');
  }).join('');
  return `<div class="grid"><section class="card s12"><h2><span>Transactions <small>${list.length} · ${fmt(total)}</small></span><button class="btn ghost" data-act="csv">Export CSV</button></h2>
    <input id="q" type="search" placeholder="Search notes, categories or amounts" value="${esc(S.q)}" style="margin-bottom:12px">${chips}
    ${rows || '<div class="empty">Nothing here yet. Press + Add (or N on your keyboard) to log an expense.</div>'}</section></div>`;
}

function allocHTML(k) {
  const base = Math.max(k.inc, k.planned, 1);
  const segs = k.m.cats.filter(c => c.budget > 0).map(c => `<u style="width:${c.budget / base * 100}%;background:${colorOf(c)}" data-tip="${tip(esc(c.name), [fmt(c.budget) + ' planned'])}"></u>`).join('');
  const free = k.inc - k.planned;
  return `<div class="alloc">${segs}${free > 0 ? `<u style="width:${free / base * 100}%;background:var(--panel2);border:1px dashed var(--dim)" data-tip="${tip('Unplanned', [fmt(free)])}"></u>` : ''}</div>
  <div class="sub" style="color:${free < 0 ? 'var(--crit)' : 'var(--dim)'}">${free < 0 ? '✕ Planned ' + fmt(-free) + ' more than your income' : fmt(Math.max(0, free)) + ' of income not planned yet'}</div>`;
}

function viewBudget() {
  const k = calc(), m = k.m;
  const sMax = nice(Math.max(k.inc, k.planned, 500));
  const cats = m.cats.map(c => `<div class="brow" data-cid="${c.id}"><i style="background:${colorOf(c)}"></i><input class="nm" value="${esc(c.name)}" data-act="rename" data-id="${c.id}" aria-label="Category name"><input type="number" inputmode="decimal" min="0" step="1" value="${c.budget}" data-act="budnum" data-id="${c.id}" aria-label="Budget"><button class="x" data-act="delcat" data-id="${c.id}" aria-label="Delete category">✕</button>
    <div class="sl"><input type="range" min="0" max="${sMax}" step="5" value="${Math.min(c.budget, sMax)}" data-act="budrange" data-id="${c.id}" aria-label="Budget slider"></div></div>`).join('');
  const inc = m.income.map(i => `<div class="tx" data-act="editinc" data-id="${i.id}"><i style="background:var(--good)">+</i><div class="d"><b>${esc(i.name)}</b><small>${i.rec ? 'recurring' : 'one-off'}</small></div><div class="a" style="color:var(--good)">+${fmt(i.amount)}</div></div>`).join('');
  return `<div class="grid">
  <section class="card s7"><h2>Plan your month <small>Drag a slider or type</small></h2><div id="alloc">${allocHTML(k)}</div><div style="margin-top:12px">${cats || '<div class="empty">No categories yet.</div>'}</div>
    <div class="frow" style="margin-top:14px"><input id="newCat" placeholder="New category (e.g. Gym)"><button class="btn" data-act="addcat" style="flex:0 0 auto">Add category</button></div></section>
  <section class="card s5"><h2>Income <small>${fmt(k.inc)}</small></h2>${inc || '<div class="empty">No income yet.</div>'}
    <div class="frow" style="margin-top:12px"><button class="btn" data-act="addinc">Add income</button><button class="btn ghost" data-act="copyinc">Copy from last month</button></div></section>
  <section class="card s12"><h2>Data</h2><div class="frow" style="align-items:end">
    <div style="flex:0 0 110px"><label class="lbl2" style="margin-top:0">Currency</label><input id="cur" value="${esc(db.cur)}" maxlength="4"></div>
    <button class="btn ghost" data-act="exp">Export backup</button><button class="btn ghost" data-act="imp">Import backup</button><button class="btn danger" data-act="reset">Erase everything</button><input type="file" id="impf" accept=".json" hidden></div>
    <p class="sub" style="margin:12px 0 0">Everything stays on this device in your browser storage. Export a backup now and then, especially before clearing browser data.</p></section></div>`;
}

function viewRecurring() {
  const cats = M().cats;
  const exp = db.recurring.filter(r => r.kind === 'expense').reduce((s, r) => s + r.amount, 0);
  const inc = db.recurring.filter(r => r.kind === 'income').reduce((s, r) => s + r.amount, 0);
  const rows = db.recurring.map(r => `<div class="tx" style="cursor:default"><i style="background:${r.kind === 'income' ? 'var(--good)' : colorOf({name: r.cat})}">${r.kind === 'income' ? '+' : esc(r.cat.slice(0, 1).toUpperCase())}</i><div class="d"><b>${esc(r.name)}</b><small>${r.kind === 'income' ? 'Income' : esc(r.cat)} · day ${r.day} each month</small></div><div class="a">${r.kind === 'income' ? '+' : '−'}${fmt(r.amount)}</div><button class="x" data-act="delrec" data-id="${r.id}" aria-label="Delete">✕</button></div>`).join('');
  return `<div class="grid"><section class="card s7"><h2>Repeats every month <small>${fmt(exp)} out · ${fmt(inc)} in</small></h2>${rows || '<div class="empty">Add rent, subscriptions or your salary once and they appear in every month automatically.</div>'}</section>
  <section class="card s5"><h2>New recurring item</h2>
    <div class="kind" id="rk"><button data-act="rkind" data-k="expense" aria-pressed="true">Expense</button><button data-act="rkind" data-k="income" aria-pressed="false">Income</button></div>
    <label class="lbl2">Name</label><input id="rName" placeholder="Rent, Netflix, Salary…">
    <div class="frow"><div><label class="lbl2">Amount</label><input id="rAmt" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div><div><label class="lbl2">Day of month</label><input id="rDay" type="number" min="1" max="31" value="1"></div></div>
    <div id="rCatWrap"><label class="lbl2">Category</label><select id="rCat">${cats.map(c => `<option>${esc(c.name)}</option>`).join('')}</select></div>
    <button class="btn" data-act="addrec" style="width:100%;margin-top:16px">Save recurring item</button></section></div>`;
}

/* ---------- render ---------- */
let lastLeft = null;
function render(keepScroll = true) {
  applyRecurring();
  $('monthLabel').textContent = monthName(cur);
  $('tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" aria-selected="${S.tab === id}" data-act="tab" data-t="${id}">${label}</button>`).join('');
  const html = S.tab === 'overview' ? viewOverview() : S.tab === 'tx' ? viewTx() : S.tab === 'budget' ? viewBudget() : viewRecurring();
  const y = scrollY; $('view').innerHTML = html; if (keepScroll) scrollTo(0, y);
  const arc = $('ringArc');
  if (arc) requestAnimationFrame(() => requestAnimationFrame(() => arc.setAttribute('stroke-dashoffset', arc.dataset.to)));
  const hl = $('heroLeft');
  if (hl) { const to = Number(hl.dataset.v); countUp(hl, lastLeft === null ? 0 : lastLeft, to); lastLeft = to; }
  const q = $('q'); if (q && S.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S.focusQ = false; }
  save();
}
function countUp(el, from, to) {
  if (reduceMotion || from === to) { el.textContent = fmt0(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt0(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- toast / tooltip ---------- */
let toastT, undoFn;
function toast(msg, undo) {
  $('toastMsg').textContent = msg; undoFn = undo || null;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 5000);
}
$('toastUndo').onclick = () => { if (undoFn) undoFn(); $('toast').classList.remove('on'); };

const tipEl = $('tip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.style.opacity = 0; return; }
  tipEl.innerHTML = t.dataset.tip; tipEl.style.opacity = 1;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = clamp(e.clientX + 14, 8, innerWidth - w - 8) + 'px';
  tipEl.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 14 : e.clientY + 16) + 'px';
});
document.addEventListener('pointerleave', () => tipEl.style.opacity = 0);
addEventListener('scroll', () => tipEl.style.opacity = 0, {passive: true});

/* ---------- add / edit dialog ---------- */
const dlg = $('dlg');
function openDlg(opt = {}) {
  const m = M();
  const edit = opt.id ? (opt.kind === 'income' ? m.income.find(i => i.id === opt.id) : m.tx.find(t => t.id === opt.id)) : null;
  let kind = opt.kind || 'expense', catId = edit && edit.cat || opt.cat || (m.cats[0] && m.cats[0].id);
  const [y, mo] = cur.split('-');
  const defDate = edit && edit.date || (cur === realYM() ? todayStr() : cur + '-01');
  const draw = () => {
    dlg.innerHTML = `<form method="dialog" id="df"><h3>${edit ? 'Edit' : 'Add'} ${kind}</h3>
    ${edit ? '' : `<div class="kind"><button type="button" data-k="expense" aria-pressed="${kind === 'expense'}">Expense</button><button type="button" data-k="income" aria-pressed="${kind === 'income'}">Income</button></div>`}
    <label class="lbl2">Amount (${esc(db.cur)})</label><input class="amt" id="dAmt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${edit ? edit.amount : ''}" required>
    ${kind === 'expense' ? `<label class="lbl2">Category</label><div class="catpick" id="dCats">${m.cats.map(c => `<button type="button" data-c="${c.id}" aria-pressed="${c.id === catId}"><i style="background:${colorOf(c)}"></i>${esc(c.name)}</button>`).join('')}</div>` : ''}
    <label class="lbl2">${kind === 'expense' ? 'Note' : 'Source'}</label><input id="dNote" placeholder="${kind === 'expense' ? 'Optional' : 'Salary, freelance…'}" value="${esc(edit ? (edit.note ?? edit.name ?? '') : '')}">
    ${kind === 'expense' ? `<label class="lbl2">Date</label><input id="dDate" type="date" min="${cur}-01" max="${cur}-${daysIn(cur)}" value="${defDate}">` : ''}
    <div class="frow" style="margin-top:20px"><button class="btn" type="submit" id="dSave" style="flex:2">${edit ? 'Save changes' : 'Add ' + kind}</button>${edit ? '<button class="btn danger" type="button" id="dDel">Delete</button>' : ''}<button class="btn ghost" type="button" id="dCancel">Cancel</button></div></form>`;
    dlg.querySelectorAll('.kind [data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; draw(); $('dAmt').focus(); });
    dlg.querySelectorAll('#dCats [data-c]').forEach(b => b.onclick = () => { catId = b.dataset.c; dlg.querySelectorAll('#dCats [data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('dCancel').onclick = () => dlg.close();
    if ($('dDel')) $('dDel').onclick = () => { removeItem(kind, edit.id); dlg.close(); };
    $('df').onsubmit = e => {
      e.preventDefault();
      const amt = parseFloat($('dAmt').value); if (!(amt > 0)) { $('dAmt').focus(); return; }
      const note = $('dNote').value.trim();
      if (kind === 'income') {
        if (edit) { edit.amount = amt; edit.name = note || 'Income'; } else m.income.push({id: uid(), name: note || 'Income', amount: amt});
      } else {
        if (!catId) { toast('Add a category first (Budget tab)'); return; }
        const date = $('dDate').value || defDate;
        if (edit) Object.assign(edit, {amount: amt, cat: catId, note, date}); else m.tx.push({id: uid(), cat: catId, amount: amt, note, date});
      }
      dlg.close(); render();
      toast(edit ? 'Saved' : (kind === 'income' ? 'Income added' : 'Expense added'));
    };
  };
  draw(); dlg.showModal(); setTimeout(() => $('dAmt') && $('dAmt').focus(), 30);
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function removeItem(kind, id) {
  const m = M();
  const list = kind === 'income' ? m.income : m.tx, i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  const [item] = list.splice(i, 1);
  if (item.rec) m.skip.push(item.rec);
  render();
  toast(kind === 'income' ? 'Income deleted' : 'Expense deleted', () => { list.splice(i, 0, item); if (item.rec) m.skip = m.skip.filter(x => x !== item.rec); render(); });
}

/* ---------- events ---------- */
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, m = M();
  switch (a) {
    case 'tab': S.tab = t.dataset.t; render(false); scrollTo(0, 0); break;
    case 'mode': S.mode = t.dataset.m; render(); break;
    case 'cat': S.cat = S.cat === id ? null : id; render(); break;
    case 'clearcat': S.cat = null; render(); break;
    case 'clearday': S.day = null; render(); break;
    case 'day': S.day = t.dataset.day; S.tab = 'tx'; render(false); scrollTo(0, 0); break;
    case 'month': cur = t.dataset.ym; S.day = null; render(); break;
    case 'edit': openDlg({id, kind: 'expense'}); break;
    case 'editinc': openDlg({id, kind: 'income'}); break;
    case 'addinc': openDlg({kind: 'income'}); break;
    case 'delcat': {
      const c = m.cats.find(c => c.id === id), n = m.tx.filter(x => x.cat === id).length;
      if (n && !confirm(`Delete "${c.name}" and its ${n} expense${n > 1 ? 's' : ''} this month?`)) break;
      const snapC = m.cats.slice(), snapT = m.tx.slice();
      m.cats = m.cats.filter(c => c.id !== id); m.tx = m.tx.filter(x => x.cat !== id); render();
      toast('Category deleted', () => { m.cats = snapC; m.tx = snapT; render(); }); break;
    }
    case 'addcat': { const el = $('newCat'), n = el.value.trim(); if (!n) { el.focus(); break; } if (m.cats.some(c => c.name.toLowerCase() === n.toLowerCase())) { toast('That category already exists'); break; } m.cats.push({id: uid(), name: n, budget: 0}); render(); break; }
    case 'copyinc': {
      const prev = db.months[shift(cur, -1)]; if (!prev || !prev.income.length) { toast('No income last month'); break; }
      prev.income.forEach(i => { if (!m.income.some(x => x.name === i.name && x.amount === i.amount)) m.income.push({id: uid(), name: i.name, amount: i.amount}); }); render(); toast('Copied income from last month'); break;
    }
    case 'csv': {
      const rows = [['Date', 'Category', 'Note', 'Amount']].concat(m.tx.sort((a, b) => a.date.localeCompare(b.date)).map(x => [x.date, (m.cats.find(c => c.id === x.cat) || {}).name || '', x.note, x.amount]));
      download(`spending-${cur}.csv`, rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv'); break;
    }
    case 'exp': download('budget-backup-' + todayStr() + '.json', JSON.stringify(db, null, 2), 'application/json'); break;
    case 'imp': $('impf').click(); break;
    case 'reset': if (confirm('Erase ALL budget data on this device? Export a backup first if unsure.')) { db = {months: {}, recurring: [], colors: {}, cur: db.cur, theme: db.theme}; render(); } break;
    case 'rkind': document.querySelectorAll('#rk button').forEach(b => b.setAttribute('aria-pressed', b === t)); $('rCatWrap').style.display = t.dataset.k === 'income' ? 'none' : ''; $('rk').dataset.k = t.dataset.k; break;
    case 'addrec': {
      const kind = ($('rk').dataset.k) || 'expense', name = $('rName').value.trim(), amt = num($('rAmt').value), day = clamp(Math.round(num($('rDay').value)) || 1, 1, 31);
      if (!name || !(amt > 0)) { toast('Enter a name and an amount'); break; }
      const cat = kind === 'expense' ? $('rCat').value : '';
      if (kind === 'expense' && !cat) { toast('Add a category first'); break; }
      db.recurring.push({id: uid(), kind, name, amount: amt, cat, day, from: cur}); render(); toast('Saved. It now appears every month'); break;
    }
    case 'delrec': { const r = db.recurring.find(r => r.id === id); if (!r) break; db.recurring = db.recurring.filter(r => r.id !== id); Object.values(db.months).forEach(mm => { mm.tx = mm.tx.filter(x => x.rec !== id); mm.income = mm.income.filter(x => x.rec !== id); }); render(); toast('Recurring item removed from all months'); break; }
  }
});

document.addEventListener('input', e => {
  const t = e.target, a = t.dataset.act, m = M();
  if (t.id === 'q') { S.q = t.value; S.focusQ = true; render(); return; }
  if (a === 'budrange' || a === 'budnum') {
    const c = m.cats.find(c => c.id === t.dataset.id); c.budget = Math.max(0, num(t.value));
    const row = t.closest('.brow'); if (a === 'budrange') row.querySelector('[data-act=budnum]').value = c.budget; else row.querySelector('[data-act=budrange]').value = Math.min(c.budget, Number(row.querySelector('[data-act=budrange]').max));
    $('alloc').innerHTML = allocHTML(calc()); save();
  }
});
document.addEventListener('change', e => {
  const t = e.target, m = M();
  if (t.dataset.act === 'rename') { const n = t.value.trim(), c = m.cats.find(c => c.id === t.dataset.id); if (n && !m.cats.some(x => x !== c && x.name.toLowerCase() === n.toLowerCase())) { c.name = n; slotFor(n); } render(); }
  if (t.dataset.act === 'budrange' || t.dataset.act === 'budnum') render();
  if (t.id === 'cur') { db.cur = t.value.trim() || '€'; render(); }
  if (t.id === 'impf') {
    t.files[0].text().then(txt => { try { const d = JSON.parse(txt); if (!d.months) throw 0; if (!confirm('Replace all current data with this backup?')) return; db = Object.assign({months: {}, recurring: [], colors: {}, cur: '€', theme: 'auto'}, d); render(); toast('Backup restored'); } catch (_) { toast('That is not a valid backup file'); } });
  }
});

$('fab').onclick = () => openDlg({cat: S.cat});
$('prev').onclick = () => { cur = shift(cur, -1); S.day = null; render(); };
$('next').onclick = () => { cur = shift(cur, 1); S.day = null; render(); };
$('monthLabel').onclick = () => { cur = realYM(); S.day = null; render(); };
$('themeBtn').onclick = () => { const order = ['auto', 'dark', 'light']; db.theme = order[(order.indexOf(db.theme) + 1) % 3]; applyTheme(); save(); toast('Theme: ' + db.theme); };
function applyTheme() {
  const r = document.documentElement;
  if (db.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', db.theme);
}
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (typing || dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n') { e.preventDefault(); openDlg({cat: S.cat}); }
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 't') $('monthLabel').click();
  if (e.key >= '1' && e.key <= '4') { S.tab = TABS[e.key - 1][0]; render(false); }
});

applyTheme();
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
